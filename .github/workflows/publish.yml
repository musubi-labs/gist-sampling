name: Publish

# Publishes to PyPI when a GitHub release is published. This uses PyPI trusted
# publishing, which needs a one-time setup on pypi.org: add this repository,
# the workflow file "publish.yml" and the environment "pypi" as a trusted
# publisher for the project "gist-sampling".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "exec(open('src/gist_sampling/_version.py').read()); print(__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
