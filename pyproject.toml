[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gist-sampling"
dynamic = ["version"]
description = "Diverse, representative subset selection with GIST (Greedy Independent Set Thresholding)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Filip" },
]
keywords = [
    "sampling",
    "subset selection",
    "coreset",
    "diversity",
    "submodular",
    "facility location",
    "active learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numba>=0.59",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "threadpoolctl>=3.2",
]

[project.urls]
Repository = "https://github.com/musubi-labs/gist-sampling"
Issues = "https://github.com/musubi-labs/gist-sampling/issues"
Changelog = "https://github.com/musubi-labs/gist-sampling/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pandas>=2.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "ruff>=0.9.0",
]
experiments = [
    "datasets>=2.14",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "sentence-transformers>=3.0",
]

[tool.hatch.version]
path = "src/gist_sampling/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gist_sampling"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/CHANGELOG.md", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = ["--doctest-modules"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "NPY",    # numpy
    "PT",     # flake8-pytest-style
    "RUF",    # ruff
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gist_sampling"]
